name: Auto-merge upstream

on:
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch:

concurrency:
  group: auto-merge-upstream
  cancel-in-progress: false

jobs:
  rebase-custom:
    name: Rebase custom onto upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Rebase single squash commit onto upstream main
        run: |
          git remote add upstream https://github.com/maillab/cloud-mail.git
          git fetch upstream main
          git config user.name "omp-sync"
          git config user.email "omp@mulin.date"
          if git rebase upstream/main; then
            git push origin custom --force-with-lease
            echo "✅ Rebase OK, custom pushed"
          else
            echo "::error::Rebase conflict with upstream, manual fix required"
            exit 1
          fi

      - name: Notify Telegram on conflict
        if: failure()
        run: |
          curl -s -f -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ cloud-mail 自動合併失敗(與上游衝突),需要人工修復 custom 分支" \
            || echo "Telegram notification failed (no token or chat id)"
